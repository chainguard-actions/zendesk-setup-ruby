name: Test .tool-versions file via working-directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          working-directory: tests/fixtures/tool-versions-dir
          bundler: none
      - name: Assert Ruby 3.1.4 installed
        env:
          ACTUAL: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "prefix: $ACTUAL"
          case "$ACTUAL" in
            */Ruby/3.1.4/*) ;;
            *) echo "FAIL: prefix does not contain Ruby/3.1.4"; exit 1 ;;
          esac
          V="$(ruby -e 'print RUBY_VERSION')"
          echo "version: $V"
          if [ "$V" != "3.1.4" ]; then
            echo "FAIL: expected 3.1.4"
            exit 1
          fi
          echo "PASS"
