name: Test reading .tool-versions from working-directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          working-directory: tests/fixtures/tool-versions-app
      - name: Assert Ruby 3.4.x was installed from .tool-versions
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          ruby -v
          VERSION="$(ruby -e 'print RUBY_VERSION')"
          echo "RUBY_VERSION: $VERSION"
          case "$VERSION" in
            3.4.*) echo "PASS" ;;
            *) echo "FAIL: expected 3.4.x"; exit 1 ;;
          esac
