name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory with .ruby-version
        run: |
          mkdir -p /tmp/ruby-test-dir
          echo "3.2" > /tmp/ruby-test-dir/.ruby-version
      - id: action
        uses: .
        with:
          working-directory: '/tmp/ruby-test-dir'
      - name: Assert ruby is available
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          ruby --version
          if ! ruby --version | grep -q "ruby 3.2"; then
            echo "FAIL: expected ruby 3.2 (from .ruby-version in working-directory)"
            exit 1
          fi
          echo "PASS"
