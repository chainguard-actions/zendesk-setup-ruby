name: Test .tool-versions file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .tool-versions
        run: |
          mkdir -p tv-test
          printf 'nodejs 20.0.0\nruby 3.3.0\n' > tv-test/.tool-versions
      - id: action
        uses: .
        with:
          working-directory: tv-test
          bundler: none
      - name: Assert ruby version from .tool-versions
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          V="$(ruby -e 'print RUBY_VERSION')"
          echo "ruby version: $V"
          if [ "$V" != "3.3.0" ]; then
            echo "FAIL: expected 3.3.0"
            exit 1
          fi
          echo "PASS"
