name: Test cache-version input accepted (bundler-cache disabled)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.3'
          bundler-cache: 'false'
          cache-version: 'v2-test'
      - name: Assert ruby installed and prefix set
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ] || [ ! -x "$PREFIX/bin/ruby" ]; then
            echo "FAIL: ruby-prefix missing or ruby not executable"
            exit 1
          fi
          VERSION="$(ruby -e 'print RUBY_VERSION')"
          echo "RUBY_VERSION: $VERSION"
          case "$VERSION" in
            3.3.*) echo "PASS" ;;
            *) echo "FAIL: expected 3.3.x"; exit 1 ;;
          esac
