name: Test bundler latest install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.3'
          bundler: latest
      - name: Assert ruby 3.3.x and bundler available
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          V="$(ruby -e 'print RUBY_VERSION')"
          echo "ruby version: $V"
          case "$V" in
            3.3.*) ;;
            *) echo "FAIL: expected 3.3.x"; exit 1 ;;
          esac
          BV="$(bundle --version)"
          echo "bundler: $BV"
          # Output is "Bundler version 2.x.y" on older bundlers, or just "4.0.23" on newer
          NUM="$(echo "$BV" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n1)"
          MAJOR="${NUM%%.*}"
          echo "parsed bundler version: $NUM (major: $MAJOR)"
          if [ -z "$MAJOR" ] || [ "$MAJOR" -lt 2 ]; then
            echo "FAIL: expected Bundler 2+"
            exit 1
          fi
          echo "PASS"
