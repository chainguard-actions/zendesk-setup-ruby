name: Test installing latest Bundler
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.3'
          bundler: latest
          working-directory: tests/fixtures/no-version-dir
      - name: Assert bundler is available
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix empty"
            exit 1
          fi
          OUT="$(bundle --version)"
          echo "bundle --version: $OUT"
          # Bundler <4 prints "Bundler version X.Y.Z"; Bundler 4+ prints just "X.Y.Z"
          if ! echo "$OUT" | grep -qE '(^|Bundler( version)? )[0-9]+\.[0-9]+'; then
            echo "FAIL: unexpected bundler version output"
            exit 1
          fi
          echo "PASS"
