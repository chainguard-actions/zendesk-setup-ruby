name: Test installing latest bundler
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare empty working directory
        run: mkdir -p "$GITHUB_WORKSPACE/rb-bundler"
      - id: action
        uses: .
        with:
          ruby-version: '3.3'
          bundler: latest
          working-directory: rb-bundler
      - name: Assert bundler available
        env:
          ACTUAL: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          OUT="$(bundle --version)"
          echo "bundle --version: $OUT"
          if ! echo "$OUT" | grep -qE '(Bundler version )?[0-9]+\.[0-9]+'; then
            echo "FAIL: bundler not available"
            exit 1
          fi
          echo "PASS"
