name: Test rubygems, self-hosted, windows-toolchain and cache-version inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.3.6'
          bundler: none
          rubygems: default
          self-hosted: 'false'
          windows-toolchain: none
          cache-version: v1
      - name: Assert ruby installed with extra inputs
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          if [ ! -x "$PREFIX/bin/ruby" ]; then
            echo "FAIL: $PREFIX/bin/ruby not found"
            exit 1
          fi
          V="$(ruby -e 'print RUBY_VERSION')"
          echo "ruby version: $V"
          if [ "$V" != "3.3.6" ]; then
            echo "FAIL: expected 3.3.6"
            exit 1
          fi
          G="$(gem --version)"
          echo "rubygems version: $G"
          if [ -z "$G" ]; then
            echo "FAIL: gem not usable"
            exit 1
          fi
          echo "PASS"
