name: Test bundler none with rubygems default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.3'
          bundler: none
          rubygems: default
      - name: Assert ruby works and the default bundler is still available
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          VERSION="$(ruby -e 'print RUBY_VERSION')"
          echo "ruby version: $VERSION"
          case "$VERSION" in
            3.3.*) ;;
            *) echo "FAIL: expected Ruby 3.3.x"; exit 1 ;;
          esac
          RUBY_PATH="$(command -v ruby)"
          echo "ruby path: $RUBY_PATH"
          if [ "$RUBY_PATH" != "$PREFIX/bin/ruby" ]; then
            echo "FAIL: ruby on PATH is not from ruby-prefix"
            exit 1
          fi
          # With bundler: none the action installs nothing, but the default
          # gem bundler that ships with Ruby must still be there. (The shared
          # toolcache may hold other bundler versions from other tests, so we
          # do not assert on the count.)
          LIST="$(gem list bundler --exact)"
          echo "$LIST"
          if ! echo "$LIST" | grep -q 'default:'; then
            echo "FAIL: default bundler gem not found"
            exit 1
          fi
          echo "PASS"
