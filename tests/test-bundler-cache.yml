name: Test Ruby setup with bundler cache
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal Gemfile
        run: |
          cat > "$GITHUB_WORKSPACE/Gemfile" <<'EOF'
          source 'https://rubygems.org'
          gem 'json'
          EOF
      - id: setup-ruby
        uses: .
        with:
          ruby-version: '3.2'
          bundler: 'latest'
          bundler-cache: 'true'
      - name: Assert ruby-prefix output is set
        env:
          PREFIX: ${{ steps.setup-ruby.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix is '$PREFIX'"
      - name: Assert Ruby is installed
        run: |
          ruby --version
          if ! ruby --version | grep -q "3\.2"; then
            echo "FAIL: expected Ruby 3.2.x"
            exit 1
          fi
          echo "PASS: Ruby 3.2 is installed"
      - name: Assert bundle is available
        run: |
          bundle --version
          echo "PASS: bundle is available"
      - name: Assert gems were installed
        run: |
          bundle list | grep json
          echo "PASS: json gem is installed"
