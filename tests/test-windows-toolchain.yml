name: Test windows-toolchain input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.2'
          windows-toolchain: 'none'
      - name: Assert ruby is available
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          ruby --version
          if ! ruby --version | grep -q "ruby 3.2"; then
            echo "FAIL: expected ruby 3.2"
            exit 1
          fi
          echo "PASS"
