name: Test windows-toolchain input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.2'
          windows-toolchain: 'none'
      - name: Assert ruby is installed
        env:
          RUBY_PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $RUBY_PREFIX"
          RUBY_VERSION=$(ruby --version)
          echo "ruby version: $RUBY_VERSION"
          if ! echo "$RUBY_VERSION" | grep -q "ruby 3.2"; then
            echo "FAIL: expected Ruby 3.2 but got: $RUBY_VERSION"
            exit 1
          fi
          if [ -z "$RUBY_PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS"
