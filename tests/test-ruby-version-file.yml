name: Test reading .ruby-version from working-directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory with .ruby-version
        run: |
          mkdir -p "$GITHUB_WORKSPACE/rb-file"
          echo "3.2" > "$GITHUB_WORKSPACE/rb-file/.ruby-version"
      - id: action
        uses: .
        with:
          working-directory: rb-file
          bundler: none
      - name: Assert Ruby 3.2 installed
        env:
          ACTUAL: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          V="$("$ACTUAL/bin/ruby" -e 'print RUBY_VERSION')"
          echo "version: $V"
          case "$V" in
            3.2.*) echo "PASS" ;;
            *) echo "FAIL: expected Ruby 3.2.x"; exit 1 ;;
          esac
