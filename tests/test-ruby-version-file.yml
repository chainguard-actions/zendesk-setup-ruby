name: Test .ruby-version file in working-directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .ruby-version
        run: |
          mkdir -p rv-test
          echo "3.2" > rv-test/.ruby-version
      - id: action
        uses: .
        with:
          working-directory: rv-test
          bundler: none
      - name: Assert ruby version from .ruby-version
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: empty ruby-prefix"
            exit 1
          fi
          V="$("$PREFIX/bin/ruby" -e 'print RUBY_VERSION')"
          echo "ruby version: $V"
          case "$V" in
            3.2.*) echo "PASS" ;;
            *) echo "FAIL: expected 3.2.x"; exit 1 ;;
          esac
