name: Test reading .ruby-version from working-directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create project dir with .ruby-version
        run: |
          mkdir -p rv-project
          echo "3.2" > rv-project/.ruby-version
      - id: action
        uses: .
        with:
          working-directory: rv-project
          bundler: none
      - name: Assert ruby version from .ruby-version
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          ACTUAL="$(ruby -e 'print RUBY_VERSION')"
          echo "actual: $ACTUAL"
          case "$ACTUAL" in
            3.2.*) echo "PASS" ;;
            *) echo "FAIL: expected 3.2.x"; exit 1 ;;
          esac
