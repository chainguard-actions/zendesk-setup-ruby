name: Test ruby-version read from .ruby-version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          bundler: none
          working-directory: tests/fixtures/ruby-version-file
      - name: Assert ruby version from .ruby-version
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix is empty"
            exit 1
          fi
          ACTUAL="$("$PREFIX/bin/ruby" -e 'print RUBY_VERSION')"
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "3.3.6" ]; then
            echo "FAIL: expected 3.3.6 from .ruby-version"
            exit 1
          fi
          echo "PASS"
