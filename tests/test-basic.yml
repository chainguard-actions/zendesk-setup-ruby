name: Test basic explicit ruby-version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.3'
          bundler: none
      - name: Assert ruby-prefix output
        env:
          ACTUAL: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "actual: $ACTUAL"
          case "$ACTUAL" in
            */Ruby/3.3.*) echo "PASS: prefix looks right" ;;
            *) echo "FAIL: unexpected ruby-prefix"; exit 1 ;;
          esac
          if [ ! -x "$ACTUAL/bin/ruby" ]; then
            echo "FAIL: $ACTUAL/bin/ruby not found"
            exit 1
          fi
          echo "PASS"
      - name: Assert ruby on PATH has expected version
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          which ruby
          V="$(ruby -e 'print RUBY_VERSION')"
          echo "version: $V"
          case "$V" in
            3.3.*) echo "PASS" ;;
            *) echo "FAIL: expected 3.3.x"; exit 1 ;;
          esac
          if [ "$(which ruby)" != "$PREFIX/bin/ruby" ]; then
            echo "FAIL: ruby on PATH is not from prefix"
            exit 1
          fi
          echo "PASS: ruby from prefix"
