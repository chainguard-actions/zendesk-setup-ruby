name: Test basic explicit ruby-version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare empty working directory
        run: mkdir -p "$GITHUB_WORKSPACE/rb-basic"
      - id: action
        uses: .
        with:
          ruby-version: '3.3'
          bundler: none
          working-directory: rb-basic
      - name: Assert ruby-prefix output and ruby version
        env:
          ACTUAL: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          if [ ! -x "$ACTUAL/bin/ruby" ]; then
            echo "FAIL: $ACTUAL/bin/ruby not found"
            exit 1
          fi
          V="$(ruby -e 'print RUBY_VERSION')"
          echo "ruby version on PATH: $V"
          case "$V" in
            3.3.*) echo "PASS" ;;
            *) echo "FAIL: expected Ruby 3.3.x"; exit 1 ;;
          esac
          WHICH="$(command -v ruby)"
          echo "which ruby: $WHICH"
          if [ "$WHICH" != "$ACTUAL/bin/ruby" ]; then
            echo "FAIL: ruby on PATH is not from ruby-prefix"
            exit 1
          fi
          echo "PASS: ruby on PATH matches prefix"
