name: Test explicit bundler version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.3'
          bundler: '2.5.6'
      - name: Assert bundler 2.5.6 available
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: empty ruby-prefix"
            exit 1
          fi
          OUT="$(bundle _2.5.6_ --version)"
          echo "bundler: $OUT"
          case "$OUT" in
            *2.5.6*) echo "PASS" ;;
            *) echo "FAIL: expected Bundler 2.5.6"; exit 1 ;;
          esac
