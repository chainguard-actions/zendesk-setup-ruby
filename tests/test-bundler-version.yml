name: Test installing a specific Bundler major version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.3'
          bundler: '2'
      - name: Assert bundler version
        run: |
          ACTUAL="$(bundle -v)"
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE 'Bundler version 2\.|^2\.'; then
            echo "FAIL: expected Bundler 2.x"
            exit 1
          fi
          echo "PASS"
