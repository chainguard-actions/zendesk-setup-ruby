name: Test rubygems default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.3.6'
          rubygems: default
          bundler: none
      - name: Assert ruby and gem available
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          V="$(ruby -e 'print RUBY_VERSION')"
          echo "ruby version: $V"
          if [ "$V" != "3.3.6" ]; then
            echo "FAIL: expected 3.3.6"
            exit 1
          fi
          GV="$(gem --version)"
          echo "gem version: $GV"
          if ! echo "$GV" | grep -qE '^[0-9]+\.[0-9]+'; then
            echo "FAIL: gem --version did not return a version"
            exit 1
          fi
          echo "PASS"
