name: Test rubygems input set to default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ruby-version: '3.3.6'
          rubygems: default
          bundler: none
          working-directory: tests/fixtures/empty-project
      - name: Assert ruby and gem available
        env:
          PREFIX: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ] || [ ! -x "$PREFIX/bin/ruby" ]; then
            echo "FAIL: ruby not installed at prefix"
            exit 1
          fi
          ACTUAL="$(ruby -e 'print RUBY_VERSION')"
          echo "ruby: $ACTUAL"
          if [ "$ACTUAL" != "3.3.6" ]; then
            echo "FAIL: expected 3.3.6"
            exit 1
          fi
          GEMV="$(gem --version)"
          echo "gem: $GEMV"
          if [ -z "$GEMV" ]; then
            echo "FAIL: gem --version empty"
            exit 1
          fi
          echo "PASS"
