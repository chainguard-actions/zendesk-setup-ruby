name: Test rubygems latest update
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare empty working directory
        run: mkdir -p "$GITHUB_WORKSPACE/rb-rubygems"
      - id: action
        uses: .
        with:
          ruby-version: '3.3'
          rubygems: latest
          bundler: none
          working-directory: rb-rubygems
      - name: Assert gem works
        env:
          ACTUAL: ${{ steps.action.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          GV="$(gem --version)"
          echo "gem --version: $GV"
          if ! echo "$GV" | grep -qE '^[0-9]+\.[0-9]+'; then
            echo "FAIL: gem not working"
            exit 1
          fi
          MAJOR="${GV%%.*}"
          if [ "$MAJOR" -lt 3 ]; then
            echo "FAIL: expected RubyGems >= 3"
            exit 1
          fi
          echo "PASS"
