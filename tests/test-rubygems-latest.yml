name: Test Ruby setup with latest RubyGems
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-ruby
        uses: .
        with:
          ruby-version: '3.1'
          rubygems: 'latest'
          bundler: 'none'
      - name: Assert ruby-prefix output is set
        env:
          PREFIX: ${{ steps.setup-ruby.outputs.ruby-prefix }}
        run: |
          echo "ruby-prefix: $PREFIX"
          if [ -z "$PREFIX" ]; then
            echo "FAIL: ruby-prefix output is empty"
            exit 1
          fi
          echo "PASS: ruby-prefix is '$PREFIX'"
      - name: Assert ruby 3.1 is installed
        run: |
          echo "Ruby version:"
          ruby --version
          if ! ruby --version | grep -q "3\.1"; then
            echo "FAIL: expected Ruby 3.1.x"
            exit 1
          fi
          echo "PASS: Ruby 3.1 is installed"
      - name: Assert gem is available and updated
        run: |
          echo "Gem version:"
          gem --version
          if ! gem --version > /dev/null 2>&1; then
            echo "FAIL: gem command not found"
            exit 1
          fi
          echo "PASS: gem is available"
